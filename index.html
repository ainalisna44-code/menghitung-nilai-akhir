<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Nilai Akhir</title>
</head>
<body>

    <h2>Kalkulator Nilai Akhir Siswa</h2>

    <label for="tugas">Nilai Tugas (30%):</label><br>
    <input type="number" id="tugas" placeholder="Masukkan nilai tugas"><br><br>

    <label for="uts">Nilai UTS (30%):</label><br>
    <input type="number" id="uts" placeholder="Masukkan nilai UTS"><br><br>

    <label for="uas">Nilai UAS (40%):</label><br>
    <input type="number" id="uas" placeholder="Masukkan nilai UAS"><br><br>

    <button onclick="hitungNilai()">Hitung Result</button>

    <p id="hasil"></p>
<script src="script.js"></script>
</body>
</html>
